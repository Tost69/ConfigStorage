name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: arduino-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: update
          compliance: specification

  compile:
    name: ${{ matrix.board.name }} / ArduinoJson ${{ matrix.arduinojson }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arduinojson: ["7.4.3", "6.21.5"]
        board:
          - name: ESP32
            fqbn: esp32:esp32:esp32
            platform: esp32:esp32
            platform-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - name: ESP8266
            fqbn: esp8266:esp8266:nodemcuv2
            platform: esp8266:esp8266
            platform-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    steps:
      - uses: actions/checkout@v4

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: ${{ matrix.board.platform }}
              source-url: ${{ matrix.board.platform-url }}
          libraries: |
            - source-path: ./
            - name: ArduinoJson
              version: ${{ matrix.arduinojson }}
          sketch-paths: |
            - examples/ConfigStorage_Basic
            - examples/ConfigStorage_Defaults
          cli-compile-flags: |
            - --warnings=all
          enable-deltas-report: false
