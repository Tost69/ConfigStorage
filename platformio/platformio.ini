; PlatformIO project that builds the ConfigStorage examples.
;
; Open this folder (platformio/) as a PlatformIO project. The library itself is taken from the
; parent directory, so changes to src/ConfigStorage.h are picked up directly.
;
;   pio run                         build the default environment
;   pio run -e esp32 -e esp8266     build both
;   pio run -e esp32 -t upload      flash
;
; Please visit the documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32
; which example to build - change to ../examples/ConfigStorage_Defaults for the other one
src_dir = ../examples/ConfigStorage_Basic

[env]
framework = arduino
lib_deps =
  bblanchon/ArduinoJson@^7
  ; the library from the repository root (PlatformIO Core 6.1+)
  symlink://..
lib_compat_mode = strict
monitor_speed = 115200
upload_speed = 921600
;upload_port = COM11
;monitor_port = COM11
build_flags =
  -D CONFIGSTORAGE_DEBUG=true

[env:esp32]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs

[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
